<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hero Studio · Linear VFX Lab</title>
  <link rel="stylesheet" href="./vfx-lab.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03050c; }
    #viewport { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #studio-bridge { position: fixed; z-index: 25; left: 18px; top: 18px; width: min(340px, calc(100vw - 36px)); }
    .bridge__head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .bridge__head button { border: 0; color: #b9c8de; background: transparent; font: 700 20px monospace; cursor:pointer; }
    .bridge__copy { color:#8796ad; font: 11px/1.5 monospace; margin:9px 0 12px; }
    .bridge__button, #studio-bridge select { box-sizing:border-box; display:block; width:100%; margin:7px 0; padding:9px 10px; border:1px solid #28405c; color:#d9e8ff; background:#0b1523; font:700 10px monospace; letter-spacing:.08em; cursor:pointer; }
    .bridge__button:hover, #studio-bridge select:hover { border-color:#55dcff; color:#55dcff; }
    .bridge__link { text-align:center; }
    .bridge__button input { display:none; }
    .bridge__mapping { margin:12px 0 10px; padding:10px 0 4px; border-top:1px solid #20324b; border-bottom:1px solid #20324b; color:#70829d; font:10px monospace; }
    .bridge__mapping > b { display:block; margin-bottom:7px; color:#a9c1dc; }
    .bridge__heroes { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }
    .bridge__hero { padding:6px 2px; border:1px solid #233b56; color:#8da5c3; background:#07101b; font:700 9px monospace; cursor:pointer; }
    .bridge__hero.is-active { border-color:#55dcff; color:#55dcff; background:#102334; }
    .bridge__route { display:grid; grid-template-columns:74px 1fr; gap:5px; margin-top:6px; }
    .bridge__route select { margin:0 !important; padding:7px 5px !important; font-size:9px !important; }
    .bridge__check { display:block; margin:7px 0; color:#8298b4; font:9px monospace; cursor:pointer; }
    .bridge__check input { accent-color:#55dcff; vertical-align:middle; }
    .bridge__small { font-size:9px; }
    .bridge__status { margin-top:10px; color:#71e7ff; font:10px/1.4 monospace; }
    .bridge__status.is-bad { color:#ff7eac; }
    .bridge__refs { margin-top:14px; padding-top:10px; border-top:1px solid #20324b; color:#70829d; font:10px monospace; }
    .bridge__refs > b { display:block; margin-bottom:7px; }
    .bridge__refs > div { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
    .bridge__ref { position:relative; padding:0; min-height:52px; border:1px solid #233b56; overflow:hidden; background:#07101b; cursor:pointer; }
    .bridge__ref:hover { border-color:#55dcff; }
    .bridge__ref img { display:block; width:100%; height:52px; object-fit:cover; object-position:center; opacity:.72; }
    .bridge__ref span { position:absolute; bottom:0; left:0; right:0; padding:3px; background:#040912d9; color:#d4e3f7; font:8px monospace; }
    .bridge__artOverlay { display:none; position:fixed; z-index:80; inset:0; place-items:center; background:#02040bcc; cursor:zoom-out; }
    .bridge__artOverlay.is-visible { display:grid; }
    .bridge__artOverlay img { max-width:min(90vw,1100px); max-height:86vh; object-fit:contain; box-shadow:0 0 50px #55dcff44; }
    .bridge__artOverlay button { position:absolute; right:24px; top:18px; color:#dff6ff; background:transparent; border:0; font:30px monospace; cursor:pointer; }
    .bridge__artOverlay small { position:absolute; bottom:24px; color:#8da5c3; font:11px monospace; }
    .bridge__legacyPanel { display:none; position:fixed; z-index:90; inset:3vh 3vw; background:#04050b; border:1px solid #28405c; box-shadow:0 0 60px #000; }
    .bridge__legacyPanel.is-visible { display:block; }
    .bridge__legacyHead { height:32px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; color:#a9c1dc; background:#0b1523; font:10px monospace; }
    .bridge__legacyHead button { border:0; color:#d9e8ff; background:transparent; font:700 20px monospace; cursor:pointer; }
    .bridge__legacyPanel iframe { display:block; width:100%; height:calc(100% - 32px); border:0; background:#04050b; }
    .is-hidden { display:none; }
    @media (max-width: 760px) { #studio-bridge { top:8px; left:8px; width:260px; } }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="loader" class="loader">
    <div class="loader__inner">
      <div class="loader__sigil"><span class="sigil sigil--a"></span><span class="sigil sigil--b"></span><span class="sigil sigil--c"></span><span class="sigil sigil--d"></span></div>
      <h1 class="loader__title">Linear VFX Lab</h1>
      <div class="loader__bar"><i id="loader-fill"></i></div>
      <p class="loader__status" id="loader-status">Growing the reference silhouettes…</p>
    </div>
  </div>
  <div id="hud" class="hud"></div>
  <div id="studio-bridge"></div>
  <script type="module" src="../src/reference-vfx/main.js"></script>
</body>
</html>
