<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hero Studio (Beta)</title>
  <link rel="stylesheet" href="./vfx-lab.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03050c; }
    #viewport { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .studio-art-overlay { display:none; position:fixed; z-index:80; inset:0; place-items:center; background:#02040bcc; cursor:zoom-out; }
    .studio-art-overlay.is-visible { display:grid; }
    .studio-art-overlay img { max-width:min(90vw,1100px); max-height:86vh; object-fit:contain; box-shadow:0 0 50px #55dcff44; }
    .studio-art-overlay button { position:absolute; right:24px; top:18px; color:#dff6ff; background:transparent; border:0; font:700 30px monospace; cursor:pointer; }
    .studio-art-overlay small { position:absolute; bottom:24px; color:#8da5c3; font:11px monospace; }
    .studio-legacy-panel { display:none; position:fixed; z-index:90; inset:3vh 3vw; background:#04050b; border:1px solid #28405c; box-shadow:0 0 60px #000; }
    .studio-legacy-panel.is-visible { display:block; }
    .studio-legacy-panel__head { height:32px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; color:#a9c1dc; background:#0b1523; font:10px monospace; }
    .studio-legacy-panel__head button { border:0; color:#d9e8ff; background:transparent; font:700 20px monospace; cursor:pointer; }
    .studio-legacy-panel iframe { display:block; width:100%; height:calc(100% - 32px); border:0; background:#04050b; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="loader" class="loader">
    <div class="loader__inner">
      <div class="loader__sigil"><span class="sigil sigil--a"></span><span class="sigil sigil--b"></span><span class="sigil sigil--c"></span><span class="sigil sigil--d"></span></div>
      <h1 class="loader__title">Hero Studio (Beta)</h1>
      <div class="loader__bar"><i id="loader-fill"></i></div>
      <p class="loader__status" id="loader-status">Growing the reference silhouettes…</p>
    </div>
  </div>
  <div id="hud" class="hud"></div>
  <script type="module" src="../src/reference-vfx/main.js"></script>
</body>
</html>
